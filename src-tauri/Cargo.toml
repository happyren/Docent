[package]
name = "docent"
version = "0.30.0"
description = "Presentation, semantics, and agent-control layer around Excalidraw"
authors = ["Kaixiang Ren"]
license = "MIT"
repository = "https://github.com/happyren/Docent"
edition = "2021"
rust-version = "1.77.2"

# The desktop store lives in the library half so the contract tests can drive
# it over real HTTP without going through the window.
[lib]
name = "docent_lib"
path = "src/lib.rs"

[[bin]]
name = "docent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Shell tooling, not runtime weight (D25) — I7 governs the npm runtime set,
# which stays react, react-dom, @excalidraw/excalidraw.
[dependencies]
tauri = { version = "2", features = [] }
# In-app updates (S13, D67): the signed-manifest updater. Shell tooling, not
# an npm runtime dependency (I7).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

# The update check's one HTTPS request (S13's notify tier — no self-update).
# Blocking and synchronous, because the check already runs on a thread of its
# own; an async stack would add a second runtime next to the one Tauri carries
# for nothing. rustls with the bundled Mozilla roots rather than `native-tls`:
# it keeps the Linux build to the GTK/webkit prerequisites the README already
# lists instead of adding an OpenSSL dev package, and behaves identically on
# all three platforms. `gzip` is dropped — the two fields parsed out of the
# response are a tag and a URL.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The content hash the working copy is measured against (S14, D29). `ring` is
# already linked into every build — ureq's rustls uses it for TLS — so naming
# it here adds a use, not a dependency: no new crate is compiled, downloaded,
# or shipped. Preferred over `sha2` for exactly that reason: sha2 is in the
# tree only as tauri-codegen's *build*-time dependency, so depending on it
# would mean compiling and linking a second hash implementation at runtime.
ring = "0.17"

# Native open/save dialogs. macOS and Windows use their platform APIs
# unconditionally; on Linux the GTK3 backend is chosen over the default
# XDG-portal one because Tauri already requires GTK3 there, so the app gains
# no new runtime service to depend on.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
