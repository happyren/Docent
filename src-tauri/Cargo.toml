[package]
name = "docent"
version = "0.0.1"
description = "Presentation, semantics, and agent-control layer around Excalidraw"
authors = ["Kaixiang Ren"]
license = "MIT"
repository = "https://github.com/happyren/Docent"
edition = "2021"
rust-version = "1.77.2"

# The desktop store lives in the library half so the contract tests can drive
# it over real HTTP without going through the window.
[lib]
name = "docent_lib"
path = "src/lib.rs"

[[bin]]
name = "docent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Shell tooling, not runtime weight (D25) — I7 governs the npm runtime set,
# which stays react, react-dom, @excalidraw/excalidraw.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
