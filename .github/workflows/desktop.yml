name: Desktop

# Desktop packages for S13. A manual dispatch produces workflow artifacts
# only; pushing a version tag (v*) additionally publishes a GitHub Release
# carrying every bundle plus the download-and-run portable zips (macOS .app
# zip, Windows bare-exe zip). Docker self-hosting is untouched by this
# workflow — see ci.yml.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One bundle for both Mac architectures; the runner is arm64, so the
          # Intel half needs its target added explicitly.
          - platform: macos-latest
            label: macOS
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            label: Linux
            args: ""
            rust-targets: ""
          - platform: windows-latest
            label: Windows
            args: ""
            rust-targets: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Store contract tests
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Docent ${{ github.ref_name }}"
          releaseDraft: false
          releaseBody: |
            Download, unzip, run — no installation:

            - **macOS**: `Docent_*_macos_universal_portable.zip` (Apple Silicon + Intel). The build is unsigned for now: if macOS calls it damaged or blocked, use System Settings → Privacy & Security → Open Anyway, or `xattr -cr Docent.app`.
            - **Windows**: `Docent_*_windows_portable.zip` — a single exe; needs the WebView2 runtime, preinstalled on Windows 11 and current Windows 10. Older machines: use the NSIS installer below instead. SmartScreen: More info → Run anyway.
            - **Linux**: the AppImage is the no-install option (`chmod +x`, run).

            Installers (dmg / msi / nsis / deb) are attached for those who prefer them.

            Docent is built on [Excalidraw](https://github.com/excalidraw/excalidraw) — full third-party licenses ship inside every bundle.

      - uses: tauri-apps/tauri-action@v0
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          args: ${{ matrix.args }}

      # Download-and-run zips (the release's headline assets). ditto keeps
      # the .app's symlinks and permissions; a plain zip tool would not.
      - name: Portable zip (macOS)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Docent.app" \
            "Docent_${VERSION}_macos_universal_portable.zip"
          gh release upload "$GITHUB_REF_NAME" "Docent_${VERSION}_macos_universal_portable.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Portable zip (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $zip = "Docent_${version}_windows_portable.zip"
          Compress-Archive -Path "src-tauri/target/release/docent.exe" -DestinationPath $zip
          gh release upload $env:GITHUB_REF_NAME $zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: docent-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/universal-apple-darwin/release/bundle/**/*
