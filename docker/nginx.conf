server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Bundled shape libraries (D23) are JSON under a non-standard extension.
    # The stock mime map has no entry for it, so they would be served as
    # application/octet-stream and gzip_types would never match — the AWS set
    # is ~3.9 MB raw and ~7× smaller gzipped at the default level. A `types`
    # block *replaces* the map inherited from the enclosing level instead of
    # extending it, so it is scoped to this location; at server level it would
    # strip the MIME type off every other file the shell serves.
    location /libraries/ {
        types {
            application/json excalidrawlib;
        }
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames under /assets — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Portfolio store (S12, D18) — same-origin so the client needs no CORS.
    location /api/ {
        proxy_pass http://store:3400;
        proxy_http_version 1.1;
        client_max_body_size 50m;
    }

    # Agent endpoint (S8, D7): MCP streamable HTTP for any MCP client.
    location /mcp {
        proxy_pass http://mcp:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Canvas side of the agent bridge — a long-lived SSE stream.
    location /bridge/ {
        proxy_pass http://mcp:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 24h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
