server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Portfolio store (S12, D18) — same-origin so the client needs no CORS.
    location /api/ {
        proxy_pass http://store:3400;
        proxy_http_version 1.1;
        client_max_body_size 50m;
    }

    # Agent endpoint (S8, D7): MCP streamable HTTP for any MCP client.
    location /mcp {
        proxy_pass http://mcp:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Canvas side of the agent bridge — a long-lived SSE stream.
    location /bridge/ {
        proxy_pass http://mcp:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_read_timeout 24h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
